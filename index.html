<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacie de Garde Proche</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            background-color: #007bff;
            color: white;
            padding: 20px;
            width: 100%;
            max-width: 600px;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            margin-top: 5px;
        }
        button:hover {
            background-color: #218838;
        }
        .pharmacy-card {
            background: #e9ecef;
            padding: 15px;
            border-radius: 5px;
            margin-top: 15px;
        }
        .loading {
            text-align: center;
            margin-top: 15px;
            font-style: italic;
            color: #666;
        }
    </style>
</head>
<body>

    <header>
        <h1>💊 Pharmacie de Garde</h1>
        <p>Trouvez les pharmacies autour d'une ville</p>
    </header>

    <div class="container">
        <h3>Rechercher par ville</h3>
        <input type="text" id="villeInput" placeholder="Ex: Paris, Lyon, Marseille...">
        <button onclick="rechercherPharmacies()">🔍 Rechercher les pharmacies</button>
        
        <div id="resultat"></div>
    </div>

    <script>
        async function rechercherPharmacies() {
            const ville = document.getElementById('villeInput').value.trim();
            const resultatDiv = document.getElementById('resultat');

            if (!ville) {
                resultatDiv.innerHTML = '<p style="color: red; margin-top: 15px;">Veuillez entrer le nom d\'une ville.</p>';
                return;
            }

            resultatDiv.innerHTML = '<div class="loading">Recherche des pharmacies en cours...</div>';

            try {
                // 1. Trouver les coordonnées GPS de la ville saisie
                const geoResponse = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(ville + ', France')}`);
                const geoData = await geoResponse.json();

                if (geoData.length === 0) {
                    resultatDiv.innerHTML = '<p style="color: red; margin-top: 15px;">Ville introuvable. Essayez à nouveau.</p>';
                    return;
                }

                const lat = geoData[0].lat;
                const lon = geoData[0].lon;

                // 2. Chercher les pharmacies autour de ces coordonnées (dans un rayon d'environ 5 km)
                const overpassUrl = `https://overpass-api.de/api/interpreter?data=[out:json];node[amenity=pharmacy](around:5000,${lat},${lon});out;`;
                const pharmaResponse = await fetch(overpassUrl);
                const pharmaData = await pharmaResponse.json();

                if (pharmaData.elements.length === 0) {
                    resultatDiv.innerHTML = '<p style="margin-top: 15px;">Aucune pharmacie trouvée à proximité de cette ville.</p>';
                    return;
                }

                // 3. Afficher la liste des pharmacies trouvées
                let html = '<h4 style="margin-top: 20px;">Pharmacies trouvées :</h4>';
                pharmaData.elements.slice(f => f.tags && f.tags.name).slice(0, 5).forEach(pharmacie => {
                    const nom = pharmacie.tags.name || "Pharmacie";
                    const rue = pharmacie.tags['addr:street'] ? pharmacie.tags['addr:street'] : "Adresse non précisée";
                    html += `
                        <div class="pharmacy-card">
                            <h4>🏥 ${nom}</h4>
                            <p>📍 Rue : ${rue}</p>
                            <p>🟢 Ouverte (vérifiez les horaires de garde locaux)</p>
                        </div>
                    `;
                });

                resultatDiv.innerHTML = html;

            } catch (error) {
                resultatDiv.innerHTML = '<p style="color: red; margin-top: 15px;">Une erreur est survenue lors de la recherche.</p>';
            }
        }
    </script>

</body>
</html>
