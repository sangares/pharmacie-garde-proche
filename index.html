<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacie de Garde Proche</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            background-color: #007bff;
            color: white;
            padding: 20px;
            width: 100%;
            max-width: 600px;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            margin-top: 5px;
        }
        button:hover {
            background-color: #218838;
        }
        .pharmacy-card {
            background: #e9ecef;
            padding: 15px;
            border-radius: 5px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <header>
        <h1>💊 Pharmacie de Garde</h1>
        <p>Trouvez rapidement une pharmacie ouverte</p>
    </header>

    <div class="container">
        <h3>Rechercher par ville</h3>
        <input type="text" id="villeInput" placeholder="Ex: Saint-Ouen-l'Aumône, Paris...">
        <button onclick="rechercherPharmacies()">🔍 Trouver les pharmacies</button>
        
        <div id="resultat"></div>
    </div>

    <script>
        function rechercherPharmacies() {
            const ville = document.getElementById('villeInput').value.trim();
            const resultatDiv = document.getElementById('resultat');

            if (!ville) {
                resultatDiv.innerHTML = '<p style="color: red; margin-top: 15px;">Veuillez entrer le nom d\'une ville.</p>';
                return;
            }

            // Affichage direct d'un résultat propre et interactif pour la ville demandée
            resultatDiv.innerHTML = `
                <div class="pharmacy-card">
                    <h4>🏥 Pharmacies à ${ville}</h4>
                    <p>📍 Zone : ${ville} et ses environs</p>
                    <p>🟢 Service de garde actif</p>
                    <p style="margin-top: 10px;">
                        <a href="https://www.google.com/maps/search/pharmacie+de+garde+${encodeURIComponent(ville)}" target="_blank" style="color: #007bff; font-weight: bold; text-decoration: none;">
                            👉 Cliquer ici pour voir les pharmacies sur la carte Google Maps
                        </a>
                    </p>
                </div>
            `;
        }
    </script>

</body>
</html>
